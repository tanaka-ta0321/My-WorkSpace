<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My PortalWorkSpace</title>
        <link rel="stylesheet" href="css/style.css">

        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home" />

    </head>

    <body>
        <!-- スマホにも対応できる柔軟なレイアウト -->
        <div id="spWrapper">

            <header>
                <br>
                <br>
                <br>
                <br>
                <h1>My PortalWorkSpaceへようこそ！</h1>
                <p>ここは自分専用にカスタム可能なポータルサイトです。</p>
            </header>

            <main>
                <div id="links" aria-label="リンク">
                    <h2>便利なリンク集</h2>
                    <ul id="linklist">
                        <li><a href="https://mail.google.com/mail/u/0/#inbox" target="_blank"
                                rel="noopener noreferrer">Gmail</a></li>
                        <li><a href="https://ku-port.sc.kogakuin.ac.jp/uprx/up/xu/xuk004/Xuk00401.xhtml" target="_blank"
                                rel="noopener noreferrer">Ku-port</a></li>
                        <li><a href="https://study.ns.kogakuin.ac.jp/lms/corsColl/doLinkKyozaiTitle" target="_blank"
                                rel="noopener noreferrer">Ku-LMS</a></li>
                        <li><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT</a></li>
                        <li><a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube</a>
                        </li>
                        <li><a href="https://app.slack.com/client/T0Y1Y62H2/C01CUQ2P9FF/" target="_blank"
                                rel="noopener noreferrer">slack</a></li>
                        <li><a href="https://www.fe-siken.com/fekakomon.php" target="_blank"
                                rel="noopener noreferrer">基本情報過去問</a></li>
                        <li><a href="https://www.udemy.com/" target="_blank" rel="noopener noreferrer">Udemy</a></li>
                        <li><a href="https://developer.mozilla.org/" target="_blank" rel="noopener noreferrer">MDN Web
                                Docs</a>
                        </li>
                    </ul>
                    <input type="text" id="newlinknametext" placeholder="追加するリンク名を入力">
                    <input type="text" id="newlinkurltext" placeholder="追加するリンクURLを入力">
                    <input type="button" value="追加" id="linkaddbutton">
                    <input type="button" value="削除" id="linkremovebutton">
                </div>

                <div id="todoapp">
                    <ul id="tasklist">
                        <li><input type="checkbox">html</li>
                        <li><input type="checkbox">css</li>
                        <li><input type="checkbox">javascript</li>
                        <li><input type="checkbox">node.js</li>
                    </ul>
                    <input type="text" id="newtasktext" placeholder="新しいタスクを追加">
                    <input type="button" value="追加" id="newtaskaddbutton">
                    <input type="button" value="削除" id="newtaskremovebutton">
                </div>
            </main>

            <footer>
                <p>&copy; 2025 RetasMaki</p>
            </footer>

            <nav>
                <div id="logo">
                    <h1>
                        My <span>PWS<sup>&trade;</sup></span>
                    </h1>
                </div>

                <div id="nav_switch">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div id="datetime"></div>
            </nav>
        </div>


        <script src="scripts/script.js"></script>
    </body>

</html>
